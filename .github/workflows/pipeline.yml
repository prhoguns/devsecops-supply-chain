# Supply-chain pipeline for demo-api.
#
# Every push and pull request runs the gates. A change only reaches the registry, gets signed and
# gets promoted to the GitOps repo if every gate passes and it is a push to main.
#
#   test ─┐
#   secrets ─┤
#   sast ────┼─► image (build + scan + smoke test) ─► release (push, sign, SBOM, provenance, verify) ─► promote
#   deps-and-config ─┘
#
# Third-party actions are pinned to full commit SHAs so a moved tag cannot change what runs here.

name: pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/demo-api
  TRIVY_VERSION: v0.74.0

jobs:
  test:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  secrets:
    name: Secret scan (Gitleaks, full branch history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks
        # --log-opts=HEAD: scan every commit reachable from the commit under test, i.e. the full
        # history of this branch. Without it Gitleaks scans all fetched refs, so a secret on any
        # other branch would fail every build.
        run: |
          # Run as the runner user so git inside the container trusts the checkout.
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose --exit-code 1 --log-opts=HEAD

  sast:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep
        # p/default rather than p/python: p/python does not include the eval()/exec() audit rules.
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.178.0 \
            semgrep scan --config p/default --config p/dockerfile --config p/github-actions \
              --metrics off --error --sarif-output semgrep.sarif
      - name: Upload results to the Security tab
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  deps-and-config:
    name: Dependency and config scan (Trivy, Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trivy filesystem scan (dependencies, secrets, Dockerfile)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Checkov (Dockerfile hardening)
        # Workflow files are covered by Semgrep's p/github-actions ruleset in the sast job.
        run: |
          docker run --rm -v "$PWD:/src" -w /src bridgecrew/checkov:3.3.19 \
            --directory . --framework dockerfile --compact --quiet

  image:
    name: Build, scan and smoke-test image
    needs: [test, secrets, sast, deps-and-config]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: demo-api:ci
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy image scan (fail on fixable HIGH or CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: demo-api:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Smoke test (starts, answers, runs as non-root, has no shell)
        run: |
          docker run -d --name smoke -p 8080:8080 --read-only demo-api:ci
          for i in $(seq 1 30); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          curl -fsS localhost:8080/api/work
          test "$(docker inspect -f '{{.Config.User}}' demo-api:ci)" = "65532"
          if docker exec smoke sh -c true 2>/dev/null; then echo "image unexpectedly has a shell"; exit 1; fi
          docker rm -f smoke

  release:
    name: Publish, sign, attest
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless signing with the workflow's OIDC identity
      attestations: write # GitHub build provenance
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          build-args: APP_VERSION=${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha
      - name: Sign image (keyless, Sigstore)
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
      - name: Attach SBOM as a signed attestation
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: GitHub build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Verify signature and SBOM attestation the way the cluster will
        run: |
          ID="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/pipeline.yml@refs/heads/main"
          cosign verify "${IMAGE}@${{ steps.build.outputs.digest }}" \
            --certificate-identity "$ID" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          cosign verify-attestation "${IMAGE}@${{ steps.build.outputs.digest }}" --type spdxjson \
            --certificate-identity "$ID" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "Signed and attested: ${IMAGE}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: Promote to GitOps repo
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Check out the GitOps repo with its deploy key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/kubernetes-gitops-platform
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}
          path: gitops
      - name: Pin the new digest
        env:
          DIGEST: ${{ needs.release.outputs.digest }}
        run: |
          cd gitops/workloads/demo-api
          # Deploy by digest, never by tag: the digest is what was scanned and signed.
          sed -i -E "s|^(\s*digest:).*|\1 ${DIGEST}|" kustomization.yaml
          grep -q "digest: ${DIGEST}" kustomization.yaml
          git diff --stat
      - name: Commit and push
        env:
          DIGEST: ${{ needs.release.outputs.digest }}
        run: |
          cd gitops
          if git diff --quiet; then echo "Digest already deployed"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "demo-api: deploy ${DIGEST:7:12} from ${GITHUB_REPOSITORY}@${GITHUB_SHA:0:7}"
          git push
