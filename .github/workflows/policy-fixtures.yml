# Negative test fixtures for the cluster's signature policy (kubernetes-gitops-platform).
#
# Publishes two images to ghcr.io/<owner>/policy-fixtures that the cluster must REJECT:
#   unsigned        - pushed, never signed
#   wrong-identity  - signed keylessly, but by THIS workflow instead of pipeline.yml
# The second one proves the policy checks who signed, not just that a signature exists.
# Run manually; the digests are written to the job summary and copied into the GitOps repo tests.

name: policy-fixtures

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      REPO: ghcr.io/${{ github.repository_owner }}/policy-fixtures
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push unsigned fixture
        id: unsigned
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.REPO }}:unsigned
          build-args: APP_VERSION=fixture-unsigned
          provenance: false
          sbom: false
      - name: Push wrong-identity fixture
        id: wrong
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.REPO }}:wrong-identity
          build-args: APP_VERSION=fixture-wrong-identity
          provenance: false
          sbom: false
      - name: Sign wrong-identity fixture with this workflow's identity
        run: cosign sign --yes "${REPO}@${{ steps.wrong.outputs.digest }}"
      - name: Summary
        run: |
          {
            echo "UNSIGNED_IMAGE=${REPO}@${{ steps.unsigned.outputs.digest }}"
            echo "WRONG_IDENTITY_IMAGE=${REPO}@${{ steps.wrong.outputs.digest }}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
